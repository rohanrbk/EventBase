services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventbase
      POSTGRES_USER: eventbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - eventbase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbase -d eventbase"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgresql://eventbase:${POSTGRES_PASSWORD}@db:5432/eventbase
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEBUG: "false"
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      PORT: "8000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - eventbase_data:/app/data
volumes:
  eventbase_pgdata:
  eventbase_data:


